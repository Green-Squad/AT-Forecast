<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="g03BUvFu_mSuN3cGWbJhZRcoJelNC4E9HzGPnf8UUaY" />
    <title>AT Forecast</title>
    <link rel="stylesheet" media="all" href="/assets/application-7c3793d66b8fdd89438fbe0564edadeff835d8821d505f2f6483eb96f7f96c1b.css?__release={{ asset_version }}" />
  </head>

  <body>
    <div id="layout" class="pure-g">
      <div class="sidebar pure-u-1 pure-u-md-1-4">
        <div class="header">
          <h1 class="brand-title"><a href="/">AT Forecast</a></h1>
          {% block sidebar %}
            <p class="brand-tagline">
              The fast, free and <a href="https://github.com/Green-Squad/AT-Forecast">open source</a> solution for weather on the Appalachian Trail.
            </p>
          {% endblock %}
          <nav class="nav">
              <ul class="nav-list">
                  <li class="nav-item">
                      <a class="pure-button" href="/about">About</a>
                  </li>
                  <li class="nav-item">
                      <a class="pure-button" href="https://github.com/Green-Squad/AT-Forecast">GitHub</a>
                  </li>
              </ul>
          </nav>
        </div>
      </div>
      <div class="content pure-u-1 pure-u-md-3-4">
        {% block content %}{% endblock %}
      </div>
    </div>
    {% if analytics %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C5G0041GWN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-C5G0041GWN');
    </script>
    {% endif %}
  </body>
</html>
