[package]
name = "at-forecast"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
askama = "0.14"
axum = "0.8"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "net"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
libsql = { version = "0.10.0", default-features = false, features = ["remote", "tls"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
