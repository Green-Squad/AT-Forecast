name: Rust baseline
on:
  push:
    branches: [rust]
  pull_request:
    branches: [master]
    paths: ['rust/**', 'tools/**', 'Dockerfile', '.github/workflows/rust.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-admin-only
          POSTGRES_DB: at_forecast_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d at_forecast_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://forecast_reader:fixture-only@127.0.0.1:5432/at_forecast_test
      AT_FORECAST_TEST_DATABASE: isolated
      CACHE_MODE: 'off'
      ENABLE_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Load isolated fixture
        env:
          PGPASSWORD: fixture-admin-only
        run: psql -h 127.0.0.1 -U postgres -d at_forecast_test -v ON_ERROR_STOP=1 -f rust/tests/fixture.sql
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked -- --nocapture
      - name: Build and smoke-test production container
        run: |
          mkdir -p benchmark-results
          docker build -t at-forecast-rust .
          START=$(date +%s%N)
          docker run -d --cpus 1 --memory 512m --name at-forecast-rust --network host -e DATABASE_URL -e CACHE_MODE -e ENABLE_ANALYTICS at-forecast-rust
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 0.1
          done
          END=$(date +%s%N)
          python3 -c "import json; print(json.dumps({'docker_to_health_ms': ($END-$START)/1e6}))" > benchmark-results/startup.json
          curl -fsS http://127.0.0.1:8080/shelters/2 > benchmark-results/shelter.html
          python3 tools/benchmark.py --requests 100 --concurrency 1 > benchmark-results/rust-c1.json
          python3 tools/benchmark.py --requests 100 --concurrency 5 > benchmark-results/rust-c5.json
          docker image inspect at-forecast-rust --format '{{.Size}}' > benchmark-results/image-bytes.txt
          docker stats --no-stream --format '{{json .}}' at-forecast-rust > benchmark-results/container-memory.json
          docker inspect at-forecast-rust --format '{{.Config.User}}' | tee benchmark-results/runtime-user.txt
          test "$(docker inspect at-forecast-rust --format '{{.Config.User}}')" = '10001:10001'
          docker exec at-forecast-rust sh -c 'test ! -e /usr/bin/cargo && test ! -e /usr/bin/ruby'
          docker kill --signal=TERM at-forecast-rust
          test "$(docker wait at-forecast-rust)" = 0
          docker logs at-forecast-rust > benchmark-results/container.log
      - name: Compare with original Rails routes and templates
        run: |
          docker build -f Dockerfile.rails -t at-forecast-rails .
          docker run -d --cpus 1 --memory 512m --name at-forecast-rust-compare --network host -e DATABASE_URL -e CACHE_MODE -e ENABLE_ANALYTICS at-forecast-rust
          docker run -d --cpus 1 --memory 512m --name at-forecast-rails --network host -e DATABASE_URL -e AT_FORECAST_TEST_DATABASE -e CACHE_MODE -e PORT=8082 -e RAILS_ENV=production -e SECRET_KEY_BASE=isolated-comparison-only at-forecast-rails bundle exec rails runner tools/rails_compare_server.rb
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/about > /dev/null; then break; fi
            sleep 1
          done
          python3 tools/compare.py --rails http://127.0.0.1:8082 --rust http://127.0.0.1:8080 | tee benchmark-results/parity.txt
          python3 tools/benchmark.py --base http://127.0.0.1:8082 --requests 100 --concurrency 1 > benchmark-results/rails-c1.json
          python3 tools/benchmark.py --base http://127.0.0.1:8082 --requests 100 --concurrency 5 > benchmark-results/rails-c5.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-validation
          path: benchmark-results/
